<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phagwara Resilience Atlas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body class="{% block body_class %}scene-clear{% endblock %}">
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-mark">PR</span>
                <span>Phagwara Resilience Atlas</span>
            </a>
            <nav class="nav">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('predict') }}">Predictor</a>
                <a href="{{ url_for('weather') }}">Forecast</a>
                <a href="{{ url_for('infrastructure_map') }}">Map</a>
                <a href="{{ url_for('about') }}">About</a>
            </nav>
        </header>
        {% block hero %}{% endblock %}
        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
    document.addEventListener('mousemove', (event) => {
        const card = event.target.closest('.hover-block');
        if (!card) return;
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mx', `${event.clientX - rect.left}px`);
        card.style.setProperty('--my', `${event.clientY - rect.top}px`);
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
